name: Build Android Offline APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run type check and clinical unit tests
        run: |
          npm run lint
          npm test

      - name: Build offline web bundle
        run: npm run build

      - name: Add Android platform if not present
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android app icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor offline assets
        run: npx cap sync android

      - name: Ensure Android SDK 36 and licenses
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null || true
            "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-medica-integral-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
